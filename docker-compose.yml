services:
  db:
    image: postgres:16-alpine
    container_name: elman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elman
      POSTGRES_PASSWORD: elman
      POSTGRES_DB: portfolio
    ports:
      - "5433:5432"
    volumes:
      - elman_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elman -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: elman-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://elman:elman@db:5432/portfolio?schema=public
      FRONTEND_ORIGIN: http://localhost:3000
      ADMIN_TOKEN: elman-admin-dev-token
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:3001
    container_name: elman-web
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  elman_pg_data:
