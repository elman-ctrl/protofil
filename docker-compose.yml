services:
  db:
    image: postgres:16-alpine
    container_name: elman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elman
      POSTGRES_PASSWORD: elman
      POSTGRES_DB: portfolio
    ports:
      - "5433:5432"
    volumes:
      - elman_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elman -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: elman-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://elman:elman@db:5432/portfolio?schema=public
      FRONTEND_ORIGIN: http://localhost:3000
      ADMIN_TOKEN: elman-admin-dev-token
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: elman-web
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  elman_pg_data:
